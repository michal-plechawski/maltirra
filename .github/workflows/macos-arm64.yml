name: macOS ARM64

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile portable sources
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Verify Apple Silicon toolchain
        id: toolchain
        run: |
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "Expected an ARM64 runner, got $(uname -m)." >&2
            exit 1
          fi

          clang++ --version
          toolchain_hash=$(clang++ --version | shasum -a 256 | cut -c1-16)
          echo "cache-key=apple-clang-$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Install native MADS 2.1.8
        run: |
          mads_path="$RUNNER_TEMP/mads"
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/tebe6502/Mad-Assembler/da7ab45531dce63bf404e7410c69585d379d55aa/bin/macos_aarch64/mads' \
            --output "$mads_path"
          echo 'ba89693a2881906d9fafca1b2d2ecf800b3d69aa374ce77fe83d9cfba864d1ef  '"$mads_path" | shasum -a 256 --check
          chmod +x "$mads_path"
          echo "MADS=$mads_path" >> "$GITHUB_ENV"

      - name: Restore macOS ARM64 object cache
        uses: actions/cache@v5
        with:
          path: obj/macOS_arm64/
          key: altirra-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('src/**') }}
          restore-keys: |
            altirra-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-

      - name: Compile non-Windows sources
        run: |
          build_log="$RUNNER_TEMP/macos-arm64-build.log"
          set +e
          bash src/platform/macOS_arm64/build.sh 2>&1 | tee "$build_log"
          build_exit=${PIPESTATUS[0]}
          set -e

          if (( build_exit != 0 )); then
            details=$(grep -E '(^|[[:space:]])error:|Undefined symbols|ld: |fatal error:' "$build_log" | head -50 || true)
            if [[ -z "$details" ]]; then
              details=$(tail -50 "$build_log")
            fi
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=macOS ARM64 build failed::$details"
            exit "$build_exit"
          fi

          cache_summary=$(grep '^Object cache summary:' "$build_log" | tail -1 || true)
          if [[ -n "$cache_summary" ]]; then
            {
              echo '### macOS ARM64 object cache'
              echo
              echo "$cache_summary"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run portable tests
        run: |
          test_log="$RUNNER_TEMP/macos-arm64-tests.log"
          set +e
          out/macOS_arm64/AltirraPortableTests 2>&1 | tee "$test_log"
          test_exit=${PIPESTATUS[0]}
          set -e

          if (( test_exit != 0 )); then
            details=$(tail -50 "$test_log")
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=macOS portable tests failed::$details"
            exit "$test_exit"
          fi

      - name: Upload macOS ARM64 build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: altirra-macos-arm64-${{ github.sha }}
          path: |
            obj/macOS_arm64/build-manifest.txt
            out/macOS_arm64/AltirraPortableTests
            out/macOS_arm64/ATCompiler
            out/macOS_arm64/firmware/
            out/macOS_arm64/Help/
          if-no-files-found: error
          retention-days: 14
