name: Windows x64

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MADS_URL: https://raw.githubusercontent.com/tebe6502/Mad-Assembler/d6d9982b8800a18fe19c780aae5ecaf2d8bd3b8c/mads.exe
  MADS_SHA256: 50cd618dc9ca92889b3867bb6ffd0bc5474384da95e9209bc6c53d89ec364787

concurrency:
  group: windows-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-boundary:
    name: Verify Windows x64 platform boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Check platform-specific source placement
        run: bash scripts/check-windows-x64-boundary.sh

  build:
    name: Build Release x64
    needs: platform-boundary
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Locate Visual Studio 2022 MSBuild
        id: toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -version '[17.14,18.0)' -products '*' `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1

          if (-not $msbuild) {
            throw 'Visual Studio 2022 17.14+ with MSBuild was not found.'
          }

          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $msbuildVersion = (Get-Item $msbuild).VersionInfo.FileVersion -replace '[^0-9.]', ''
          $vsPath = Split-Path (Split-Path (Split-Path (Split-Path $msbuild)))
          $msvcVersion = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory |
            Sort-Object { [Version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          $sdkVersion = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' |
            Sort-Object { [Version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $msvcVersion -or -not $sdkVersion) {
            throw 'Could not determine the MSVC and Windows SDK versions for the cache key.'
          }

          $madsHash = $env:MADS_SHA256.Substring(0, 12)
          "cache-key=msbuild-$msbuildVersion-msvc-$msvcVersion-sdk-$sdkVersion-mads-$madsHash" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore Release x64 build cache
        id: release-cache
        uses: actions/cache@v5
        with:
          path: |
            obj/ReleaseAMD64/
            lib/ReleaseAMD64/
            out/ReleaseAMD64/
          key: altirra-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-release-${{ hashFiles('src/**') }}
          restore-keys: |
            altirra-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-release-

      - name: Install MADS 2.1.0
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $madsDirectory = Join-Path $env:RUNNER_TEMP 'mads-2.1.0'
          $madsPath = Join-Path $madsDirectory 'mads.exe'
          New-Item -ItemType Directory -Path $madsDirectory -Force | Out-Null
          Invoke-WebRequest -Uri $env:MADS_URL -OutFile $madsPath

          $actualHash = (Get-FileHash -Path $madsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:MADS_SHA256) {
            throw "MADS checksum mismatch: expected $env:MADS_SHA256, got $actualHash"
          }

          $madsDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Windows x64 release
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & $env:MSBUILD_EXE 'src\Altirra.sln' `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Build Windows x64 RMT plugins
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pluginProjects = @(
            'src\AltirraRMTPOKEY\AltirraRMTPOKEY.vcxproj'
            'src\AltirraRMTC6502\AltirraRMTC6502.vcxproj'
          )

          foreach ($project in $pluginProjects) {
            & $env:MSBUILD_EXE $project `
              /m `
              /t:Build `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify x64 outputs
        shell: pwsh
        run: |
          $outputs = @(
            'out\ReleaseAMD64\Altirra64.exe'
            'out\ReleaseAMD64\sa_pokey.dll'
            'out\ReleaseAMD64\sa_c6502.dll'
          )

          foreach ($output in $outputs) {
            if (-not (Test-Path -Path $output -PathType Leaf)) {
              throw "Expected build output was not created: $output"
            }

            Get-Item $output | Format-List FullName, Length, LastWriteTimeUtc
          }

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: altirra-windows-x64-${{ github.sha }}
          path: out/ReleaseAMD64/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Run automatic tests x64
    needs: platform-boundary
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Locate Visual Studio 2022 MSBuild
        id: toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -version '[17.14,18.0)' -products '*' `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1

          if (-not $msbuild) {
            throw 'Visual Studio 2022 17.14+ with MSBuild was not found.'
          }

          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $msbuildVersion = (Get-Item $msbuild).VersionInfo.FileVersion -replace '[^0-9.]', ''
          $vsPath = Split-Path (Split-Path (Split-Path (Split-Path $msbuild)))
          $msvcVersion = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory |
            Sort-Object { [Version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          $sdkVersion = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' |
            Sort-Object { [Version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $msvcVersion -or -not $sdkVersion) {
            throw 'Could not determine the MSVC and Windows SDK versions for the cache key.'
          }

          $madsHash = $env:MADS_SHA256.Substring(0, 12)
          "cache-key=msbuild-$msbuildVersion-msvc-$msvcVersion-sdk-$sdkVersion-mads-$madsHash" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore ProfileTest x64 build cache
        id: test-cache
        uses: actions/cache@v5
        with:
          path: |
            obj/ReleaseAMD64/
            lib/ReleaseAMD64/
            out/ReleaseAMD64/
            obj/ProfileAMD64/
            lib/ProfileAMD64/
            out/ProfileAMD64/
          key: altirra-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-profiletest-${{ hashFiles('src/**') }}
          restore-keys: |
            altirra-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-profiletest-

      - name: Install MADS 2.1.0
        if: steps.test-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $madsDirectory = Join-Path $env:RUNNER_TEMP 'mads-2.1.0'
          $madsPath = Join-Path $madsDirectory 'mads.exe'
          New-Item -ItemType Directory -Path $madsDirectory -Force | Out-Null
          Invoke-WebRequest -Uri $env:MADS_URL -OutFile $madsPath

          $actualHash = (Get-FileHash -Path $madsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:MADS_SHA256) {
            throw "MADS checksum mismatch: expected $env:MADS_SHA256, got $actualHash"
          }

          $madsDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Non-Release configurations invoke these host tools from out\ReleaseAMD64.
      - name: Build native x64 tools
        if: steps.test-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $toolProjects = @(
            'src\Asuka\Asuka.vcxproj'
            'src\ATCompiler\ATCompiler.vcxproj'
          )

          foreach ($project in $toolProjects) {
            $buildOutput = & $env:MSBUILD_EXE $project `
              /m `
              /t:Build `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal 2>&1
            $buildExitCode = $LASTEXITCODE
            $buildOutput | ForEach-Object { Write-Host $_ }

            if ($buildExitCode -ne 0) {
              $details = ($buildOutput | Select-Object -Last 50) -join "`n"
              $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Native tool build failed ($project)::$details"
              exit $buildExitCode
            }
          }

      - name: Build x64 automatic test runner
        if: steps.test-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $buildOutput = & $env:MSBUILD_EXE 'src\Altirra.sln' `
            /m `
            /t:Build `
            /p:Configuration=ProfileTest `
            /p:Platform=x64 `
            /verbosity:minimal 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }

          if ($buildExitCode -ne 0) {
            $details = ($buildOutput | Select-Object -Last 50) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Automatic test runner build failed::$details"
            exit $buildExitCode
          }

      - name: Run x64 automatic tests
        shell: pwsh
        working-directory: src/ATTest
        run: |
          $testExecutable = Join-Path $env:GITHUB_WORKSPACE 'out\ProfileAMD64\AltirraTest64.exe'
          if (-not (Test-Path -Path $testExecutable -PathType Leaf)) {
            throw "Expected test runner was not created: $testExecutable"
          }

          $testOutput = & $testExecutable all 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host $_ }

          if ($testExitCode -ne 0) {
            $details = ($testOutput | Select-Object -Last 50) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Altirra automatic tests failed::$details"
            exit $testExitCode
          }
